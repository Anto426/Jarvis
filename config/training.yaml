training:
  # =========================
  # BATCHING
  # =========================
  per_device_batch_size: 1
  gradient_accumulation_steps: 16
  eval_batch_size: 1

  # =========================
  # OPTIMIZER
  # =========================
  learning_rate: 2e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1e-8
  max_grad_norm: 1.0

  # =========================
  # SCHEDULER
  # =========================
  scheduler: "cosine"
  warmup_ratio: 0.03

  # =========================
  # TRAINING CONTROL
  # =========================
  num_train_epochs: 1
  max_steps: null
  logging_steps: 50
  eval_steps: 1000
  save_steps: 1000
  save_total_limit: 3
  status_update_seconds: 5

  # =========================
  # PRECISION
  # =========================
  mixed_precision: "fp16"
  gradient_checkpointing: true
  tf32: true
  fused_optimizer: true
  torch_compile: false
  attention_implementation: "sdpa"
  auto_batch_size: false
  max_auto_batch_size: 4
  auto_batch_repeats: 2
  target_vram_fraction: 0.92

  # =========================
  # DATA
  # =========================
  dataloader_num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  drop_last: true
